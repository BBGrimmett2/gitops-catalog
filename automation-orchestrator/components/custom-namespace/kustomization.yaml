---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Override namespace name and update database connection strings accordingly
# Usage: Add to overlay's components list, then set namespace field

replacements:
  # Replace database host references with the custom namespace
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: Secret
          name: orchestrator-pg-credentials
        fieldPaths:
          - stringData.host
        options:
          delimiter: '.'
          index: 1
      - select:
          kind: Secret
          name: temporal-pg-credentials
        fieldPaths:
          - stringData.host
        options:
          delimiter: '.'
          index: 1
