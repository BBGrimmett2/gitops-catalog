---
# ArgoCD Application for Automation Orchestrator POC/Demo
# Deploys complete stack: PostgreSQL + Automation Orchestrator to ao-demo namespace
#
# PREREQUISITES (MUST RUN BEFORE APPLYING):
# 1. Grant ArgoCD admin permissions to target namespace:
#    oc adm policy add-role-to-user admin \
#      system:serviceaccount:openshift-gitops:openshift-gitops-argocd-application-controller \
#      -n ao-demo
#
#    Note: This is required because ArgoCD needs to create Secrets, Services,
#    StatefulSets, Jobs, and the AutomationOrchestrator CR in the namespace.
#
# DEPLOYMENT:
# 2. Apply this application (automated sync will deploy everything):
#    oc apply -f automation-orchestrator-argocd-app.yaml
#
# 3. Monitor deployment:
#    oc get application automation-orchestrator-demo -n openshift-gitops
#    oc get pods -n ao-demo
#
# CREDENTIALS:
# - PostgreSQL password: RedHat123 (POC/Lab only - change for production!)
# - Admin password: Check secret automation-orchestrator-initial-admin-password
#
# ACCESS:
# - UI Route: oc get route automation-orchestrator -n ao-demo

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: automation-orchestrator-demo
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/BBGrimmett2/gitops-catalog.git
    targetRevision: automation-orchestrator
    path: automation-orchestrator/instance/overlays/argocd-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: ao-demo
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates/0/status
