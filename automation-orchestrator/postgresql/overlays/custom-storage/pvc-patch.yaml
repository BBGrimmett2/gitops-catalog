---
# Example storage class patch for custom storage requirements
# Modify storageClassName and storage size as needed for your environment
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
spec:
  volumeClaimTemplates:
  - metadata:
      name: postgresql-data
    spec:
      storageClassName: gp3  # Change to your storage class (e.g., fast-ssd, gp2, etc.)
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 50Gi  # Adjust size for production needs
