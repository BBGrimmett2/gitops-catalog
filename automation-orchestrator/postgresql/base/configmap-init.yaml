---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init-sql
data:
  init-databases.sql: |
    -- Automation Orchestrator Database Initialization
    -- POC/Lab placeholder password: 'RedHat123' - CHANGE FOR PRODUCTION!

    -- Create users with necessary privileges
    -- CREATEROLE and CREATEDB allow the user to manage extensions
    CREATE USER orchestrator WITH PASSWORD 'RedHat123' CREATEROLE CREATEDB;
    CREATE USER temporal WITH PASSWORD 'RedHat123' CREATEDB;

    -- Create databases with ownership
    CREATE DATABASE orchestrator OWNER orchestrator;
    CREATE DATABASE temporal OWNER temporal;
    CREATE DATABASE temporal_visibility OWNER temporal;

    -- Grant privileges (required for schema migrations)
    GRANT ALL PRIVILEGES ON DATABASE orchestrator TO orchestrator;
    GRANT ALL PRIVILEGES ON DATABASE temporal TO temporal;
    GRANT ALL PRIVILEGES ON DATABASE temporal_visibility TO temporal;

    -- Switch to orchestrator database and create extension owned by orchestrator
    \c orchestrator
    SET ROLE orchestrator;
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    RESET ROLE;

    -- Verify setup
    \echo 'Verifying database creation...'
    \l orchestrator
    \l temporal
    \l temporal_visibility
    \echo 'Database initialization complete!'
