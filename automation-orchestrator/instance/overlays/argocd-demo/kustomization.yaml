---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: Namespace is NOT set here - ArgoCD will inject it
# This allows deploying to any namespace without modifying the overlay

resources:
  - ../../base
  - ../../../postgresql/base

patches:
  - target:
      kind: StatefulSet
      name: postgresql
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "1"
  - target:
      kind: Service
      name: postgresql
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "1"
  - target:
      kind: Job
      name: postgresql-init-databases
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "2"

# POC/Lab placeholder secrets
# WARNING FOR PRODUCTION: Replace with secure secrets
secretGenerator:
  - name: orchestrator-pg-credentials
    literals:
      - host=postgresql
      - port=5432
      - database=orchestrator
      - username=orchestrator
      - password=RedHat123
      - sslmode=prefer
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "1"
  - name: temporal-pg-credentials
    literals:
      - host=postgresql
      - port=5432
      - database=temporal
      - username=temporal
      - password=RedHat123
      - sslmode=prefer
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "1"
