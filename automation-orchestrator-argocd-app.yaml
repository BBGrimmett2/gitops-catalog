---
# ArgoCD Application for Automation Orchestrator POC/Demo
# Deploys to dedicated ao-demo namespace
#
# Prerequisites:
# 1. Grant ArgoCD permissions to the namespace:
#    oc adm policy add-role-to-user admin \
#      system:serviceaccount:openshift-gitops:openshift-gitops-argocd-application-controller \
#      -n ao-demo
#
# 2. Apply this application:
#    oc apply -f automation-orchestrator-argocd-app.yaml

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: automation-orchestrator-demo
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/BBGrimmett2/gitops-catalog.git
    targetRevision: automation-orchestrator
    path: automation-orchestrator/instance/overlays/with-postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: ao-demo
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates/0/status
